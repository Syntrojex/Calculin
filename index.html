  <style>
    /* Pre-load skeleton (desktop only). React replaces #root's contents on mount. */
    #boot { display: none; }
    @media (min-width: 640px) {
      #boot { display: block; min-height: 100vh; padding: 20px 24px; background: #f6f6fb; }
      #boot.d { background: #0a0a14; }
      #boot .w { max-width: 1152px; margin: 0 auto; }
      #boot .b { border-radius: 16px; background-color: rgba(120,120,160,.14);
        background-image: linear-gradient(100deg, transparent 30%, rgba(124,108,255,.22) 50%, transparent 70%);
        background-size: 250% 100%; animation: bootShimmer 1.4s linear infinite; }
      #boot.d .b { background-color: rgba(255,255,255,.06); }
      #boot .hd { height: 56px; border-radius: 999px; margin-bottom: 22px; }
      #boot .tabs { display: flex; gap: 10px; margin-bottom: 18px; }
      #boot .tabs .b { height: 36px; width: 120px; border-radius: 999px; }
      #boot .tiles { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; margin-bottom: 22px; }
      #boot .tiles .b { height: 92px; }
      #boot .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; }
      #boot .cols .b.a { height: 340px; border-radius: 24px; margin-bottom: 18px; }
      #boot .cols .b.c { height: 190px; border-radius: 24px; }
      #boot .cols .b.g { height: 540px; border-radius: 24px; }
    }
    @keyframes bootShimmer { from { background-position: 150% 0; } to { background-position: -100% 0; } }
    @media (prefers-reduced-motion: reduce) { #boot .b { animation: none; } }
  </style>
  <script>
    try {
      var st = JSON.parse(localStorage.getItem("calcio-settings") || "null");
      var dark = st && st.theme ? st.theme === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
      document.documentElement.setAttribute("data-boot", dark ? "d" : "l");
    } catch (e) {}
  </script>

    <div class="cols"><div><div class="b a"></div><div class="b c"></div></div><div class="b g"></div></div>
  </div></div></div>
  <script>var bt=document.getElementById("boot");if(bt&&document.documentElement.getAttribute("data-boot")==="d")bt.className="d";</script>
